<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Liebst du mich?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a1e2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="gate.js"></script>
</head>
<body>
  <main>
    <a class="back" href="spiele.html">‹ Spiele</a>
    <h1 class="frage-gross">Liebst du mich?</h1>
    <button id="ja">JA</button>
    <p id="richtig" hidden>Richtige Antwort ♥</p>
  </main>
  <button id="nein">Nein</button>
  <script>
    (function () {
      var nein = document.getElementById("nein"), ja = document.getElementById("ja");
      var skala = 1, bewegt = false;
      function ueberlappt(a, b) {
        return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
      }
      nein.addEventListener("click", function () {
        skala = Math.max(0.35, skala * 0.8);
        nein.style.fontSize = (1.4 * skala) + "rem";
        nein.style.transform = "none";
        bewegt = true;
        var jr = ja.getBoundingClientRect();
        for (var k = 0; k < 30; k++) {
          var x = 12 + Math.random() * (window.innerWidth - nein.offsetWidth - 24);
          var y = 60 + Math.random() * (window.innerHeight - nein.offsetHeight - 80);
          nein.style.left = x + "px"; nein.style.top = y + "px"; nein.style.bottom = "auto";
          if (!ueberlappt(nein.getBoundingClientRect(), jr)) break;
        }
      });
      ja.addEventListener("click", function () {
        nein.hidden = true; ja.hidden = true;
        document.getElementById("richtig").hidden = false;
        for (var k = 0; k < 24; k++) {
          var h = document.createElement("span");
          h.className = "floating-heart"; h.textContent = "♥"; h.style.color = "var(--accent)";
          h.style.left = (Math.random() * 90 + 5) + "vw"; h.style.top = (40 + Math.random() * 50) + "vh";
          h.style.animationDelay = (Math.random() * 0.6) + "s";
          document.body.appendChild(h);
          setTimeout(function (el) { el.remove(); }.bind(null, h), 2400);
        }
      });
    })();
  </script>
</body>
</html>
