<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Für dich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#3a1e2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Für dich">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <a class="back" href="index.html">‹ Startseite</a>
    <!-- Wird von script.js befüllt -->
    <section id="countdown" hidden>
      <h1>Noch nicht ganz …</h1>
      <p id="countdown-text"></p>
    </section>

    <section id="day" hidden>
      <p id="day-label"></p>
      <figure class="polaroid">
        <img id="day-image" alt="">
        <figcaption id="day-caption"></figcaption>
      </figure>
      <p id="day-text"></p>
      <nav>
        <button id="prev" aria-label="Voriger Tag">‹ Gestern</button>
        <button id="next" aria-label="Nächster Tag">Weiter ›</button>
      </nav>
    </section>
  </main>

  <script src="eintraege.js"></script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
