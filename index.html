<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Für dich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#3a1e2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Für dich">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="gate.js"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1>Für <span id="name"></span></h1>
      <p>If you ever forget how much you really mean to me --- Every day i will remind you</p>
    </header>

    <section aria-live="polite">
      <p class="big-number" id="tage-zusammen">0</p>
      <p class="big-label" id="tage-label">Tage zusammen</p>
      <p class="small-line" id="stunden-zusammen"></p>
    </section>

    <section class="cards">
      <div class="card">
        <p class="kicker">Bis zu deinem Geburtstag</p>
        <p class="num" id="bis-geburtstag">–</p>
        <p class="sub" id="geburtstag-sub"></p>
      </div>
      <div class="card">
        <p class="kicker">Bis zu unserem Jahrestag</p>
        <p class="num" id="bis-jahrestag">–</p>
        <p class="sub" id="jahrestag-sub"></p>
      </div>
      <div class="card">
        <p class="kicker">Nächster Meilenstein</p>
        <p class="num" id="bis-meilenstein">–</p>
        <p class="sub" id="meilenstein-sub"></p>
      </div>
    </section>

    <button id="herz" aria-label="Überraschungs-Satz anzeigen">♥</button>
    <p id="herz-text">Tipp aufs Herz.</p>

    <a class="cta" href="tage.html">Zu deinen Tagen ›</a>
    <a class="cta" href="archiv.html">Rückblick ›</a>
  </main>

  <script src="start.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
